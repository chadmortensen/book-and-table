name: Deploy Book & Table to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '23 15 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify Instagram integration
        run: npm run test:instagram

      - name: Refresh Instagram snapshot
        # Only public post metadata and preview images enter the build.
        # A failed refresh stops deployment, preserving the published site.
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
        run: npm run refresh:instagram

      - name: Verify Substack integration
        run: npm run test:substack

      - name: Refresh Substack snapshot
        # Substack can reject hosted runners. Keep validated saved articles
        # and warn instead of blocking unrelated website updates.
        run: npm run refresh:substack -- --allow-cached

      - name: Build website
        run: npm run build

      - name: Add single-page app fallback
        run: cp dist/index.html dist/404.html

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
